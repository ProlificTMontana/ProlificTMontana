<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="348" viewBox="0 0 1200 348" fill="none" role="img" aria-labelledby="t"><title id="t">Experience — career progression</title><desc>I.T Support Intern → Red Team Intern → Freelance Tech Admin &amp; Web Developer → Full-Stack Engineer</desc><style>@font-face{font-family:'TT Display';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'TT Display';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'TT Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}.d5{font-family:'TT Display','Segoe UI',Helvetica,Arial,sans-serif;font-weight:500}.d7{font-family:'TT Display','Segoe UI',Helvetica,Arial,sans-serif;font-weight:700}.m4{font-family:'TT Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><clipPath id="cc"><rect x="0" y="0" width="1200" height="348" rx="18"/></clipPath><radialGradient id="g1" cx="1100" cy="40" r="420" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#06966a" stop-opacity="0.08"/><stop offset="1" stop-color="#06966a" stop-opacity="0"/></radialGradient><linearGradient id="rail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cbd5e1" stop-opacity="1"/><stop offset="0.6" stop-color="#7c2ff0" stop-opacity="0.9"/><stop offset="1" stop-color="#06966a" stop-opacity="1"/></linearGradient></defs><rect x="0.5" y="0.5" width="1199" height="347" rx="18" fill="#ffffff" stroke="#e1e7ef"/><g clip-path="url(#cc)"><circle cx="1100" cy="40" r="420" fill="url(#g1)"/></g><rect x="34" y="77" width="1132" height="2" rx="1" fill="url(#rail)"/><text x="34" y="54" class="m4" font-size="13" fill="#4e5b6e" letter-spacing="1.6">STAGE 01</text><circle cx="41" cy="78" r="6" fill="#ffffff" stroke="#8b97a8" stroke-width="2.5"/><rect x="34.5" y="104.5" width="101.5" height="25" rx="13" fill="#f3f6fa" stroke="#cbd5e1"/><text x="85.25" y="121.5" class="m4" font-size="12.5" fill="#4e5b6e" text-anchor="middle">Foundations</text><text x="34" y="156" class="d7" font-size="22" fill="#0d1520" letter-spacing="-0.3">I.T Support Intern</text><text x="34" y="186" class="d5" font-size="16.5" fill="#4e5b6e">First-line support for 100+</text><text x="34" y="211" class="d5" font-size="16.5" fill="#4e5b6e">users. Microsoft 365 and Azure</text><text x="34" y="236" class="d5" font-size="16.5" fill="#4e5b6e">AD administration, firewall rules,</text><text x="34" y="261" class="d5" font-size="16.5" fill="#4e5b6e">network segmentation and</text><text x="34" y="286" class="d5" font-size="16.5" fill="#4e5b6e">Wi-Fi hardening.</text><text x="323.5" y="54" class="m4" font-size="13" fill="#4e5b6e" letter-spacing="1.6">STAGE 02</text><circle cx="330.5" cy="78" r="6" fill="#ffffff" stroke="#8b97a8" stroke-width="2.5"/><rect x="324" y="104.5" width="71.5" height="25" rx="13" fill="#f3f6fa" stroke="#cbd5e1"/><text x="359.75" y="121.5" class="m4" font-size="12.5" fill="#4e5b6e" text-anchor="middle">Offense</text><text x="323.5" y="156" class="d7" font-size="22" fill="#0d1520" letter-spacing="-0.3">Red Team Intern</text><text x="323.5" y="186" class="d5" font-size="16.5" fill="#4e5b6e">Simulated cyber-attacks to</text><text x="323.5" y="211" class="d5" font-size="16.5" fill="#4e5b6e">surface weaknesses, analysed</text><text x="323.5" y="236" class="d5" font-size="16.5" fill="#4e5b6e">traffic with Wireshark and</text><text x="323.5" y="261" class="d5" font-size="16.5" fill="#4e5b6e">co-authored remediation plans</text><text x="323.5" y="286" class="d5" font-size="16.5" fill="#4e5b6e">with defenders.</text><text x="613" y="54" class="m4" font-size="13" fill="#4e5b6e" letter-spacing="1.6">STAGE 03</text><circle cx="620" cy="78" r="6" fill="#ffffff" stroke="#7c2ff0" stroke-width="2.5"/><rect x="613.5" y="104.5" width="101.5" height="25" rx="13" fill="#f3f6fa" stroke="#cbd5e1"/><text x="664.25" y="121.5" class="m4" font-size="12.5" fill="#4e5b6e" text-anchor="middle">Independent</text><text x="613" y="156" class="d7" font-size="22" fill="#0d1520" letter-spacing="-0.3">Freelance Tech Admin &amp;</text><text x="613" y="184" class="d7" font-size="22" fill="#0d1520" letter-spacing="-0.3">Web Developer</text><text x="613" y="214" class="d5" font-size="16.5" fill="#4e5b6e">Ran Microsoft 365 for small</text><text x="613" y="239" class="d5" font-size="16.5" fill="#4e5b6e">businesses, delivered remote IT</text><text x="613" y="264" class="d5" font-size="16.5" fill="#4e5b6e">support and shipped secure</text><text x="613" y="289" class="d5" font-size="16.5" fill="#4e5b6e">web apps through CI/CD.</text><text x="902.5" y="54" class="m4" font-size="13" fill="#06966a" letter-spacing="1.6">NOW</text><circle cx="909.5" cy="78" r="6" fill="#06966a"/><circle cx="909.5" cy="78" r="6" fill="none" stroke="#06966a" stroke-width="1.5"><animate attributeName="r" values="6;18" dur="2s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="2s" begin="0s" repeatCount="indefinite"/></circle><rect x="903" y="104.5" width="71.5" height="25" rx="13" fill="#f3f6fa" stroke="#cbd5e1"/><text x="938.75" y="121.5" class="m4" font-size="12.5" fill="#06966a" text-anchor="middle">Product</text><text x="902.5" y="156" class="d7" font-size="22" fill="#0d1520" letter-spacing="-0.3">Full-Stack Engineer</text><text x="902.5" y="186" class="d5" font-size="16.5" fill="#4e5b6e">Building and deploying</text><text x="902.5" y="211" class="d5" font-size="16.5" fill="#4e5b6e">full-stack platforms for</text><text x="902.5" y="236" class="d5" font-size="16.5" fill="#4e5b6e">businesses with hardened CI/CD</text><text x="902.5" y="261" class="d5" font-size="16.5" fill="#4e5b6e">and Microsoft 365 API</text><text x="902.5" y="286" class="d5" font-size="16.5" fill="#4e5b6e">integrations.</text></svg>
