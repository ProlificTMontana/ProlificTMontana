# Renders the live "Telemetry" card and publishes it to the `output` branch.
# The README embeds it from raw.githubusercontent.com/<user>/<user>/output/.
# Publishing to a separate orphan branch keeps daily refreshes out of main's
# history (and out of your contribution graph).
name: telemetry

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "profile/**"
      - ".github/workflows/telemetry.yml"

permissions:
  contents: write # push to the `output` branch only

concurrency:
  group: telemetry
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: profile/requirements.txt

      - run: pip install -r profile/requirements.txt

      - name: Render telemetry
        env:
          # Optional: add a fine-grained PAT as TELEMETRY_TOKEN (read-only) to
          # include private contribution counts. Falls back to the job token.
          GITHUB_TOKEN: ${{ secrets.TELEMETRY_TOKEN || secrets.GITHUB_TOKEN }}
          INCLUDE_PRIVATE: ${{ vars.TELEMETRY_INCLUDE_PRIVATE || '0' }}
          EXCLUDE_LANGUAGES: ${{ vars.TELEMETRY_EXCLUDE_LANGUAGES || '' }}
        run: python profile/telemetry.py --out dist

      - name: Publish to output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b output
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "telemetry: refresh $(date -u +%F)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
