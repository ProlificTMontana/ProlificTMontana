# Guards the generated profile: committed assets and README must match what
# profile/build.py produces, and the telemetry renderer must work offline.
name: profile-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: profile/requirements.txt

      - run: pip install -r profile/requirements.txt

      - name: Rebuild assets and README
        run: python profile/build.py

      - name: Fail if generated files are stale
        run: |
          if ! git diff --quiet -- assets README.md; then
            echo "::error::Generated files are out of date. Run 'python profile/build.py' and commit the result."
            git diff --stat -- assets README.md
            exit 1
          fi

      - name: Smoke-test telemetry renderer
        run: python profile/telemetry.py --sample --out "$RUNNER_TEMP/telemetry"
